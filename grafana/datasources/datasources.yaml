apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-metrics-backend
    access: proxy
    url: http://prometheus:9090
    isDefault: true


  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-metrics-backend

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000