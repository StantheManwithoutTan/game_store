[pytest]
pythonpath = .
testpaths = tests
markers =
    deployed: pruebas contra un sistema desplegado (requieren BASE_URL)
    smoke: verificaciones básicas de disponibilidad del despliegue
    api: contrato, CRUD y validaciones de la API desplegada
    integration: integración API + PostgreSQL + Keycloak reales
    keycloak: autenticación y configuración del Keycloak desplegado
    security: cabeceras, TLS, CORS, JWT y postura del ambiente