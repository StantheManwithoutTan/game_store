<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Home</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
        .navbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .brand { font-size: 20px; font-weight: 600; color: #333; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .user-info span { color: #666; }
        .btn-logout { padding: 8px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-logout:hover { background: #c0392b; }
        .container { max-width: 800px; margin: 48px auto; padding: 0 24px; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); }
        h1 { margin: 0 0 16px; color: #333; }
        p { color: #666; margin: 8px 0; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">Game Store</div>
        <div class="user-info">
            <span>{{ user.name or user.email }}</span>
            <form action="{{ url_for('logout') }}" method="post">
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h1>Bienvenido, {{ user.name or user.email }}!</h1>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Sub:</strong> {{ user.sub }}</p>
        </div>
    </div>
</body>
</html>
