<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Login</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .card { background: white; padding: 48px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin: 0 0 8px; color: #333; }
        p { color: #666; margin-bottom: 32px; }
        .btn { display: inline-block; padding: 12px 32px; background: #aa3bff; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #9028e0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Game Store</h1>
        <p>Inicia sesión para continuar</p>
        <a href="{{ url_for('openid_connect') }}" class="btn">Iniciar sesión con Keycloak</a>
    </div>
</body>
</html>
