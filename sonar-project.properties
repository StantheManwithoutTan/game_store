sonar.projectKey=game-store
sonar.organization=stanthemanwithouttan
sonar.host.url=https://sonarcloud.io
sonar.projectName=Game Store

# Sources
sonar.sources=backend/,game_store_frontend/src/
sonar.tests=backend/tests/,game_store_frontend/tests/

# Language-specific
sonar.python.version=3.12
sonar.typescript.tsconfigPath=game_store_frontend/tsconfig.json

# Coverage
sonar.python.coverage.reportPaths=backend/coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (test files, migrations, etc.)
sonar.exclusions=backend/tests/**,game_store_frontend/tests/**,**/migrations/**,**/__pycache__/**,**/node_modules/**,**/*.min.js,**/.venv/**,**/venv/**,**/site-packages/**sonar.test.exclusions=**/migrations/**

