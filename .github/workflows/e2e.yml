name: E2E Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game_store_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright@1.61.0 install chromium
      - run: npx --no-install playwright@1.61.0 test
        env:
          JWT_SECRET_ACTUAL: ${{ secrets.JWT_SECRET_ACTUAL }}