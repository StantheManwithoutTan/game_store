name: CI Pipeline
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════ FASE 1: CÓDIGO ═══════════════
  checkout-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
        working-directory: game_store_frontend
      - run: npm run build
        working-directory: game_store_frontend

  # ═══════════════ FASE 2: PARALELO ═══════════════
  unit-tests:
    needs: checkout-and-build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pytest tests/test_product_service.py tests/test_stock_service.py -v --cov

  security-audit:
    needs: checkout-and-build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - run: "pip install pip-audit==2.10.1 --only-binary :all:"
      - run: pip-audit -r requirements.txt
      - name: Pre-pull testcontainers image
        run: docker pull postgres:15

      - name: Install dependencies
        run: "pip install --require-hashes --only-binary :all: -r requirements.txt"

      - name: Install security tools
        run: "pip install pip-audit==2.10.1 --only-binary :all:"

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Product Unit tests
        run: pytest tests/test_product_service.py -v --cov=services --cov=models --cov-report=xml

      - name: Stock Unit tests
        run: pytest tests/test_stock_service.py -v --cov=services --cov=models --cov-report=xml

  # ═══════════════ FASE 3: PRUEBAS CONTRA SISTEMA VIVO ═══════════════
  integration-tests:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: docker pull postgres:15
      - run: pytest tests/test_product_integration.py tests/test_stock_integration.py -v --cov

  api-tests:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: docker pull postgres:15
      - run: pytest tests/test_product_api.py tests/test_permissions.py tests/test_security.py -v --cov

  e2e-tests:
    needs: api-tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: game_store_frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright@1.61.0 install chromium
      - name: Create .env for CI
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: |
          cat <<EOF > ../.devcontainer/.env
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=game_store
          DATABASE_HOST=db
          DATABASE_PORT=5432
          SECRET_KEY=${SECRET_KEY}
          FRONTEND_URL=http://localhost:5173
          KEYCLOAK_SERVER_URL=http://keycloak:8080
          KEYCLOAK_SERVER_URL_EXTERNAL=http://localhost:8080
          KEYCLOAK_CLIENT_ID=game-store-client
          KEYCLOAK_REALM=game-store
          KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
          EOF
      - name: Validar .env generado
        run: |
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            grep -Eq "^${key}=.+" ../.devcontainer/.env \
              || { echo "::error::${key} vacío en ../.devcontainer/.env (¿secret sin definir?)"; exit 1; }
          done
      - run: docker compose --env-file ../.devcontainer/.env -f ../.devcontainer/docker-compose.yml up -d db backend
      - run: |
          for i in {1..15}; do
            curl --fail --silent http://localhost:5000/login && break
            sleep 3
          done
      - run: npx --no-install playwright@1.61.0 test
        env:
          JWT_SECRET_ACTUAL: ${{ secrets.JWT_SECRET_ACTUAL }}
      - name: Mostrar diagnóstico
        if: failure()
        run: |
          docker compose --env-file ../.devcontainer/.env -f ../.devcontainer/docker-compose.yml ps -a
          docker compose --env-file ../.devcontainer/.env -f ../.devcontainer/docker-compose.yml logs --no-color --tail=200 db backend
          docker inspect --format '{{.Name}} estado={{.State.Status}} exit={{.State.ExitCode}}' devcontainer-db-1 || true
      - run: docker compose --env-file ../.devcontainer/.env -f ../.devcontainer/docker-compose.yml down -v
        if: always()

  security-zap:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for security scan
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: |
          cat <<EOF > .devcontainer/.env
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=game_store
          DATABASE_HOST=db
          DATABASE_PORT=5432
          SECRET_KEY=${SECRET_KEY}
          FRONTEND_URL=http://localhost:5173
          KEYCLOAK_SERVER_URL=http://keycloak:8080
          KEYCLOAK_SERVER_URL_EXTERNAL=http://localhost:8080
          KEYCLOAK_CLIENT_ID=game-store-client
          KEYCLOAK_REALM=game-store
          KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
          EOF
      - name: Validar .env generado
        run: |
          for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            grep -Eq "^${key}=.+" .devcontainer/.env \
              || { echo "::error::${key} vacío en .devcontainer/.env (¿secret sin definir?)"; exit 1; }
          done
      - run: docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml build backend
      - run: docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml up -d db backend
      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml ps
          docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml logs --no-color db backend
      - run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:5000/login > /dev/null && break
            sleep 5
          done
      - run: mkdir -p security && chmod 750 security
      - run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/security:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: security/zap-report.html
          retention-days: 14
      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml ps -a
          docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml logs --no-color --tail=200 db backend
          docker inspect --format '{{.Name}} estado={{.State.Status}} exit={{.State.ExitCode}}' devcontainer-db-1 || true
      - run: docker compose --env-file .devcontainer/.env -f .devcontainer/docker-compose.yml down -v --remove-orphans
        if: always()

  # ═══════════════ FASE 4: DOCKER BUILD ═══════════════
  docker-build:
    permissions:
      contents: read
      packages: write
    needs:
      - integration-tests
      - api-tests
      - e2e-tests
      - security-zap
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: game_store_frontend
            dockerfile: game_store_frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.name }}:${{ github.sha }}

  # ═══════════════ FASE 5: DEPLOY (reemplazado con otra estrategia para subir todas las imagenes en la maquina virtual)═══════════════
  