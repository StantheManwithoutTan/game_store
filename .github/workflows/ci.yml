name: CI Pipeline
on: [push, pull_request]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════ FASE 1: CÓDIGO ═══════════════
  checkout-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: game_store_frontend
      - run: npm run build
        working-directory: game_store_frontend

  # ═══════════════ FASE 2: PARALELO ═══════════════
  unit-tests:
    needs: checkout-and-build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest tests/test_product_service.py tests/test_stock_service.py -v --cov

  security-audit:
    needs: checkout-and-build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: Pre-pull testcontainers image
        run: docker pull postgres:15

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install security tools
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Product Unit tests
        run: pytest tests/test_product_service.py -v --cov=services --cov=models --cov-report=xml

      - name: Stock Unit tests
        run: pytest tests/test_stock_service.py -v --cov=services --cov=models --cov-report=xml

  quality-gates:
    needs: checkout-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-vercel-preview:
    needs: checkout-and-build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: game_store_frontend }
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ═══════════════ FASE 3: PRUEBAS CONTRA SISTEMA VIVO ═══════════════
  integration-tests:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: docker pull postgres:15
      - run: pytest tests/test_product_integration.py tests/test_stock_integration.py -v --cov

  api-tests:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: docker pull postgres:15
      - run: pytest tests/test_product_api.py tests/test_permissions.py tests/test_security.py -v --cov

  e2e-tests:
    needs: api-tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: game_store_frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Create .env for CI
        run: |
          cat <<EOF > ../.devcontainer/.env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=game_store
          DATABASE_HOST=db
          DATABASE_PORT=5432
          SECRET_KEY=ci-e2e-test-secret
          FRONTEND_URL=http://localhost:5173
          KEYCLOAK_SERVER_URL=http://keycloak:8080
          KEYCLOAK_SERVER_URL_EXTERNAL=http://localhost:8080
          KEYCLOAK_CLIENT_ID=game-store-client
          KEYCLOAK_REALM=game-store
          KEYCLOAK_CLIENT_SECRET=
          EOF
      - run: docker compose -f ../.devcontainer/docker-compose.yml up -d db backend
      - run: |
          for i in {1..15}; do
            curl --fail --silent http://localhost:5000/login && break
            sleep 3
          done
      - run: npx playwright test
        env:
          JWT_SECRET_ACTUAL: ${{ secrets.JWT_SECRET_ACTUAL }}
      - run: docker compose -f ../.devcontainer/docker-compose.yml down -v
        if: always()

  security-zap:
    needs: [unit-tests, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat <<EOF > .devcontainer/.env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=game_store
          DATABASE_HOST=db
          DATABASE_PORT=5432
          SECRET_KEY=ci-security-test-secret
          FRONTEND_URL=http://localhost:5173
          KEYCLOAK_SERVER_URL=http://keycloak:8080
          KEYCLOAK_SERVER_URL_EXTERNAL=http://localhost:8080
          KEYCLOAK_CLIENT_ID=game-store-client
          KEYCLOAK_REALM=game-store
          KEYCLOAK_CLIENT_SECRET=
          EOF
      - run: docker compose -f .devcontainer/docker-compose.yml build backend
      - run: docker compose -f .devcontainer/docker-compose.yml up -d db backend
      - run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:5000/login > /dev/null && break
            sleep 5
          done
      - run: mkdir -p security && chmod 777 security
      - run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/security:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: security/zap-report.html
          retention-days: 14
      - run: docker compose -f .devcontainer/docker-compose.yml down -v --remove-orphans
        if: always()

  # ═══════════════ FASE 4: DOCKER BUILD ═══════════════
  docker-build:
    needs:
      - integration-tests
      - api-tests
      - e2e-tests
      - security-zap
      - quality-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  # ═══════════════ FASE 5: DEPLOY ═══════════════
  deploy-production:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: game_store_frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}