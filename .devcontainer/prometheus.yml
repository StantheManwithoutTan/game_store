global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "flask"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:5000
    
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets:
          - cadvisor:8080

remote_write:
  - url: http://prometheus:9090/api/v1/write