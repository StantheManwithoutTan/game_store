route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "default"

receivers:
  - name: "default"
    # Sin Slack/email → las alertas solo aparecen en Grafana
    # Para probar: webhook dummy
    webhook_configs:
      - url: "http://localhost:9093/webhook"