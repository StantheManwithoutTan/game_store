groups:
  - name: game-store-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m])
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate > 5% in last 5 minutes"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
          > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency > 1s"

      - alert: HighAuthFailures
        expr: |
          rate(http_requests_total{endpoint="/auth/login", status="401"}[1m])
          > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Auth failures > 10 in 1 minute"