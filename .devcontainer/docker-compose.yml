services:

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    volumes:
      - ../backend:/app
      # Agregamos el socket de docker al backend para que Jenkins puede crear nuevos contenedores para realizar las pruebas.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"
    depends_on:
        db:
          condition: service_healthy
        alloy:
          condition: service_started
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py

  frontend:
    build:
      context: ../game_store_frontend
    volumes:
      - ../game_store_frontend:/app
      # excluimos el node_modules del frontend para que usa el del contenedor para evitar conflictos
      - /app/node_modules
    ports:
      - "5173:5173"

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
    - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      #usamos 5433 para evitar colisiones posibles con conexiones locales de postgres
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/01-init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../keycloak:/opt/keycloak/data/import

  jenkins:
    build:
      # lo corremos en root para poder usar Docker
      context: .
      dockerfile: ../Dockerfile.jenkins

    container_name: jenkins

    user: root

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      # Para dar permiso a todo el codigo fuente para correr
      - ../:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - alertmanager 

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - tempo
  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    volumes:
    - ./alloy/config.alloy:/etc/alloy/config.alloy
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "/etc/alloy/config.alloy"]

  tempo:
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
    ports:
      - "3200:3200"   # API de Tempo

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"

volumes:
  postgres-data:
  jenkins_home:
  grafana-storage:
  prometheus-data: